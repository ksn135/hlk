# OnlyOffice Document Server — Apache, виртуальный путь /oo
#
# Сценарий: https://lk.vodorodfilm.com/oo/ → http://192.168.3.140:80/
# (тот же Document Server, что обслуживает vis.vodorodfilm.com/oo)
#
# Обязательные модули:
#   a2enmod proxy proxy_http proxy_wstunnel rewrite headers setenvif
#
# В .env.local / .env.local.php приложения HLK:
#   ONLYOFFICE_URL=/oo
#   ONLYOFFICE_APP_URL=https://lk.vodorodfilm.com
#   ONLYOFFICE_DS_APP_URL=https://lk.vodorodfilm.com
#   ONLYOFFICE_INTERNAL_URL=http://192.168.3.140:80
#   ONLYOFFICE_JWT_SECRET=<тот же секрет, что на Document Server>
#   HLK_FILES_DIR=/var/www/vis/shared/public/files
#   и symlink/Alias: lk /files → тот же каталог (см. docs/onlyoffice.md)
#
# Критично: X-Forwarded-Host ДОЛЖЕН содержать виртуальный путь /oo,
# иначе Document Server сгенерирует ссылки на vis.vodorodfilm.com
# → «Загрузка не удалась».
#
# Подключение внутри VirtualHost *:443 для lk.vodorodfilm.com:

Define OO_VPATH /oo
Define OO_BACKEND 192.168.3.140:80

<Location /oo>
    Require all granted

    SetEnvIf Host "^(.*)$" THE_HOST=$1
    RequestHeader setifempty X-Forwarded-Proto https
    RequestHeader setifempty X-Forwarded-Host %{THE_HOST}e
    RequestHeader edit X-Forwarded-Host "(.*)" "$1/oo"
    ProxyAddHeaders Off
</Location>

RewriteEngine On
RewriteCond %{HTTP:Upgrade} websocket [NC]
RewriteCond %{HTTP:Connection} upgrade [NC]
RewriteRule ^/oo/?(.*) "ws://192.168.3.140:80/$1" [P,L]

ProxyPass        /oo/ http://192.168.3.140:80/
ProxyPassReverse /oo/ http://192.168.3.140:80/

# Если Document Server всё ещё отдаёт vis.vodorodfilm.com в теле ответов
# (общий backend с продом), раскомментируйте и включите mod_substitute + mod_filter:
#
# <Location /oo>
#     AddOutputFilterByType SUBSTITUTE text/html text/javascript application/javascript application/json text/css
#     Header unset Content-Encoding
#     Substitute "s|https://vis\.vodorodfilm\.com/oo|https://lk.vodorodfilm.com/oo|ni"
#     Substitute "s|wss://vis\.vodorodfilm\.com/oo|wss://lk.vodorodfilm.com/oo|ni"
# </Location>
